services:
  db:
    image: postgres:16-alpine
    container_name: fastapi_blog_db
    environment:
      - POSTGRES_DB=fastapi_blog
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_blog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: fastapi_blog
    ports:
      - "8000:8000"
    environment:
      - environment=prod
      - secret_key=CHANGE_TO_A_STRONG_RANDOM_SECRET
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/fastapi_blog
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: fastapi_blog_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
