services:
  web:
    build: .
    container_name: fastapi_blog
    ports:
      - "8000:8000"
    environment:
      - environment=prod
      - secret_key=CHANGE_TO_A_STRONG_RANDOM_SECRET
    volumes:
      - blog_data:/app/data
      - media_data:/app/media
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: fastapi_blog_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - web
    restart: unless-stopped

volumes:
  blog_data:
  media_data:
